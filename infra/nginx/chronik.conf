# 辰箓 (Chronik) · Nginx 反代 + HTTPS
# 用法：复制到 /etc/nginx/conf.d/chronik.conf 后 `nginx -t && systemctl reload nginx`
# 前置：chronik.cn 的 A 记录已指向本机公网 IP，且 80/443 端口在云安全组放行

# —— 80 端口：仅服务 ACME 证书校验，其余 301 跳 HTTPS ——
server {
    listen 80;
    server_name chronik.cn www.chronik.cn;

    # Let's Encrypt HTTP-01 challenge 目录（certbot --webroot 用）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# —— 443 端口：SSL 终止 + 反代到本地 bazi-system (8787) ——
server {
    listen 443 ssl;
    http2 on;
    server_name chronik.cn www.chronik.cn;

    # certbot 申请的证书路径（申请后自动生成）
    ssl_certificate     /etc/letsencrypt/live/chronik.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chronik.cn/privkey.pem;

    # 基础安全基线
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：强制浏览器走 HTTPS（部署稳定后再开启，避免证书出问题时锁死）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传/下载大小（命盘报告含图，放开限制）
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # 透传真实客户端信息给 Node 服务
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # SSE / 流式 AI 对话需要：关闭缓冲、保持长连接
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
