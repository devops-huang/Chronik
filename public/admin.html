<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>辰箓 · 管理后台</title>
  <style>
    :root{
      --bg:#0e0c08; --panel:#171310; --panel-2:#1f1a14; --line:#33291d;
      --gold:#c9a85a; --gold-bright:#e8c878; --txt:#ece3d2; --muted:#9a8f78;
      --ok:#5fbf7a; --err:#e07a6a;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;background:radial-gradient(1200px 600px at 50% -10%,#241c12 0%,var(--bg) 60%);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
      display:flex;align-items:flex-start;justify-content:center;padding:24px}
    .card{width:100%;max-width:560px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
      border:1px solid var(--line);border-radius:18px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
    .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
    h1{font-size:19px;margin:0;letter-spacing:1px;color:var(--gold-bright)}
    .sub{color:var(--muted);font-size:12.5px;margin:6px 0 20px;line-height:1.6}
    h2.sec{font-size:15px;color:var(--gold);margin:24px 0 12px;padding-top:18px;border-top:1px solid var(--line);letter-spacing:.5px}
    .field{position:relative;margin-bottom:15px}
    .field label{display:block;font-size:13px;color:var(--gold);margin-bottom:7px;letter-spacing:.5px}
    .field input, .field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
      background:var(--bg);color:var(--txt);font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
    .field textarea{resize:vertical;min-height:110px;line-height:1.6}
    .field input:focus, .field textarea:focus{border-color:var(--gold)}
    .field .tip{font-size:11.5px;color:var(--muted);margin-top:6px}
    .row{display:flex;gap:12px}
    .row .field{flex:1}
    .mini{position:absolute;right:8px;top:30px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);
      background:var(--bg);color:var(--gold);font-size:11.5px;cursor:pointer;letter-spacing:.5px}
    .mini:hover{border-color:var(--gold);color:var(--gold-bright)}
    .btn{width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;cursor:pointer;
      background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a140a;font-weight:700;
      font-size:14.5px;letter-spacing:1px;transition:filter .15s}
    .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold);width:auto;padding:6px 14px;margin:0;font-size:12.5px}
    .btn:hover{filter:brightness(1.06)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .status{margin-top:14px;font-size:13px;text-align:center;min-height:20px;line-height:1.5}
    .status.ok{color:var(--ok)} .status.err{color:var(--err)} .status.info{color:var(--muted)}
    .list{margin-top:14px}
    .code-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);
      border-radius:8px;margin-bottom:7px;font-size:13px}
    .code-item .c{font-family:monospace;color:var(--gold-bright)}
    .code-item .m{color:var(--muted);font-size:11.5px;text-align:right}
    .code-item.used .c{color:var(--muted);text-decoration:line-through}
    .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--muted)}
    .foot a{color:var(--gold);text-decoration:none}
    code{background:var(--bg);padding:2px 6px;border-radius:6px;color:var(--gold-bright)}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><h1><span class="seal-name">辰箓</span> · 管理后台</h1></div>
    <div class="sub">管理员专用 · 配置大模型接口、批量生成结缘堂兑换码。<br>普通用户无此入口，操作需管理员令牌。</div>

    <div class="field">
      <label>管理员令牌</label>
      <input id="token" type="password" placeholder="访问令牌" autocomplete="off">
      <button type="button" class="mini" id="reloadBtn">🔄 加载</button>
      <div class="tip">URL 带 <code>?token=</code> 可自动填入</div>
    </div>

    <!-- 一、模型配置（I1 原有功能，保留） -->
    <h2 class="sec">① 大模型接口配置</h2>
    <div class="field">
      <label>接口地址 Base URL</label>
      <input id="baseUrl" placeholder="https://xxx/v1">
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off">
      <div class="tip" id="keyTip">首次配置必填；仅修改其他项时可留空（保留原密钥）</div>
    </div>
    <div class="field">
      <label>模型名 Model</label>
      <input id="model" placeholder="如 qwen-plus / deepseek-chat">
    </div>
    <button class="btn" id="saveBtn" disabled>保存模型配置</button>

    <!-- 二、兑换码管理（I3 新增） -->
    <h2 class="sec">② 结缘堂兑换码管理</h2>
    <div class="field">
      <label>批量兑换码（每行一个，或用英文逗号分隔）</label>
      <textarea id="codes" placeholder="YEAR-AB12-CD34&#10;YEAR-EF56-GH78&#10;YEAR-IJ90-KL12"></textarea>
      <div class="tip">重复码自动跳过（不覆盖）。</div>
    </div>
    <div class="row">
      <div class="field">
        <label>有效期（天）</label>
        <input id="duration" type="number" value="365" min="1" max="3650">
        <div class="tip">默认 365（Edward 拍板）</div>
      </div>
      <div class="field">
        <label>套餐</label>
        <input id="plan" type="text" value="year" placeholder="year">
      </div>
    </div>
    <button class="btn" id="genBtn" disabled>生成兑换码</button>

    <div class="list">
      <h2 class="sec" style="display:flex;justify-content:space-between;align-items:center;padding-top:0;border-top:none;margin-top:8px">
        <span>已发卡</span>
        <button class="btn ghost" id="refreshBtn">刷新列表</button>
      </h2>
      <div id="codeList"><div class="tip" style="color:var(--muted)">尚未加载列表</div></div>
    </div>

    <div class="status info" id="status">请填写令牌后加载或保存</div>
    <div class="foot"><a href="/studio.html">← 返回推演阁</a></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const status = (msg, cls) => { const s = $('status'); s.textContent = msg; s.className = 'status ' + (cls || 'info'); };
    const tokenFromUrl = new URL(location.href).searchParams.get('token') || '';

    function token() { return $('token').value.trim(); }
    function setSaveEnabled() { const t = token(); $('saveBtn').disabled = !t; $('genBtn').disabled = !t; }
    function authHeaders(extra) { return Object.assign({ 'Content-Type': 'application/json' }, extra || {}); }

    // ── ① 模型配置（沿用 I1 /api/admin/llm）──
    async function loadCurrent() {
      const t = token();
      if (!t) { status('请先填写管理员令牌', 'err'); return; }
      try {
        const r = await fetch('/api/admin/llm?token=' + encodeURIComponent(t));
        const d = await r.json();
        if (!r.ok) { status(d.error || '加载失败', 'err'); return; }
        $('baseUrl').value = d.baseUrl || '';
        $('model').value = d.model || '';
        $('apiKey').value = '';
        if (d.configured) {
          $('keyTip').textContent = '当前已配置：' + (d.apiKeyMask || '****') + '（' + (d.updatedAt ? '更新于 ' + d.updatedAt : '') + '）；留空则保持不变';
          status('已加载当前配置（密钥已脱敏）', 'ok');
        } else {
          $('keyTip').textContent = '尚未配置，apiKey 为必填';
          status('当前未配置模型', 'info');
        }
      } catch (e) { status('网络错误：' + e.message, 'err'); }
    }
    $('token').addEventListener('input', setSaveEnabled);
    $('reloadBtn').addEventListener('click', loadCurrent);
    $('saveBtn').addEventListener('click', async () => {
      const t = token();
      const baseUrl = $('baseUrl').value.trim();
      const apiKey = $('apiKey').value.trim();
      const model = $('model').value.trim();
      if (!t) { status('请填写管理员令牌', 'err'); return; }
      if (!baseUrl || !model) { status('Base URL 与 Model 为必填', 'err'); return; }
      $('saveBtn').disabled = true; status('保存中…', 'info');
      try {
        const r = await fetch('/api/admin/llm', {
          method: 'POST', headers: authHeaders({ Authorization: 'Bearer ' + t }),
          body: JSON.stringify({ token: t, baseUrl, apiKey, model }),
        });
        const d = await r.json();
        if (!r.ok) status(d.error || '保存失败', 'err');
        else { status('✅ 已保存（密钥 ' + (d.apiKeyMask || '****') + ' 已加密存储）', 'ok'); $('apiKey').value = ''; }
      } catch (e) { status('网络错误：' + e.message, 'err'); }
      finally { $('saveBtn').disabled = false; }
    });

    // ── ② 兑换码管理（I3 /api/admin/redeem-codes）──
    async function genCodes() {
      const t = token();
      if (!t) { status('请先填写管理员令牌', 'err'); return; }
      const raw = ($('codes').value || '').split(/[\n,，\s]+/).map((s) => s.trim()).filter(Boolean);
      if (!raw.length) { status('请至少填写一个兑换码', 'err'); return; }
      const body = raw.map((code) => ({ code, durationDays: Number($('duration').value) || 365, plan: ($('plan').value || 'year').trim() }));
      $('genBtn').disabled = true; status('生成中…', 'info');
      try {
        const r = await fetch('/api/admin/redeem-codes', {
          method: 'POST', headers: authHeaders({ Authorization: 'Bearer ' + t }),
          body: JSON.stringify(body),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { status(d.error || '生成失败', 'err'); }
        else { status('✅ 已生成 ' + (d.createdCount || 0) + ' 个兑换码', 'ok'); $('codes').value = ''; loadList(); }
      } catch (e) { status('网络错误：' + e.message, 'err'); }
      finally { $('genBtn').disabled = false; }
    }
    async function loadList() {
      const t = token();
      if (!t) { status('请先填写管理员令牌', 'err'); return; }
      try {
        const r = await fetch('/api/admin/redeem-codes?token=' + encodeURIComponent(t));
        const d = await r.json().catch(() => ({}));
        if (!r.ok) { $('codeList').innerHTML = '<div class="tip" style="color:var(--err)">' + (d.error || '加载失败') + '</div>'; return; }
        const codes = d.codes || [];
        if (!codes.length) { $('codeList').innerHTML = '<div class="tip" style="color:var(--muted)">暂无兑换码</div>'; return; }
        $('codeList').innerHTML = codes.map((c) => {
          const used = c.status === 'used';
          const exp = c.valid_until ? new Date(c.valid_until).toLocaleString('zh-CN') : '永久';
          return `<div class="code-item ${used ? 'used' : ''}">
            <span class="c">${c.code}</span>
            <span class="m">${used ? '已使用' : '未使用'} · ${c.plan} · ${c.duration_days}天<br>有效期至 ${exp}</span>
          </div>`;
        }).join('');
      } catch (e) { $('codeList').innerHTML = '<div class="tip" style="color:var(--err)">加载失败：' + e.message + '</div>'; }
    }
    $('genBtn').addEventListener('click', genCodes);
    $('refreshBtn').addEventListener('click', loadList);

    // 初始化：URL 带 token 则自动填入并加载
    if (tokenFromUrl) { $('token').value = tokenFromUrl; setSaveEnabled(); loadCurrent(); loadList(); }
  </script>
</body>
</html>
